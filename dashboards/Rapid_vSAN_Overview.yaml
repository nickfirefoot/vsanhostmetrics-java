    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    Uptime</span> &mdash; Time since the host last booted.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Hardware
