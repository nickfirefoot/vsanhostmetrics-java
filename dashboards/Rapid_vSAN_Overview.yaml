- id: 53d2c928-1cd4-5e05-ae18-f3323e934c9e
  type: TextDisplay
  title: How to read this
  coords:
    x: 1
    y: 36
    w: 12
    h: 7
  html: '<div style="font-family:''Metropolis'',''Segoe UI'',sans-serif;font-size:13px;padding:12px
    14px;background:#2b3137;color:#e9edf0;border:1px solid rgba(255,255,255,0.18);border-radius:6px">

    <h2 style="font-size:15px;font-weight:700;margin:2px 0 10px 0;color:#e9edf0">vSAN
    overview &mdash; which layer should you look at first?</h2>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Each table below shows
    one layer of the vSAN IO path: the front end that virtual machines see, the owner
    that coordinates writes, the back end that talks to the disks, and the RDT transport
    between hosts. Use it to choose a layer, then open the matching detail screen.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">The same measures are reported
    at each layer, so a latency or congestion figure can be compared from one layer
    to the next. Capacity is shown for the cluster, and <b style="font-weight:700;color:#e9edf0">Host
    health and load</b> is vCenter''s view of each host, included for context.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">The owner is the host that
    coordinates a given object''s writes across its replicas, and it can be a different
    host from the one a virtual machine runs on.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Reading any column here</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Where
    the data lives.</b> This pack creates no objects of its own. Its vSAN figures
    are metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan</code>
    on vCenter''s own cluster, host and virtual machine objects, and each panel below
    reaches them from the selected cluster through vCenter''s cluster, host and virtual
    machine relationships.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Units
    are in the column heading.</b> A heading with no unit has no unit declared for
    that metric.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">A
    blank cell is not a zero.</b> A blank cell means no value was collected for that
    column in the selected period.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Raw
    columns are cumulative counts.</b> Where a column has a Raw twin, the Raw column
    is the cumulative count and the other column is a per-interval rate.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Capacity</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster Capacity</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Capacity</code>
    on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Free
    Capacity (B)</span> &mdash; Unused vSAN capacity.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Used
    Capacity (B)</span> &mdash; Consumed vSAN capacity, after deduplication and compression.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Total
    Capacity (B)</span> &mdash; Usable vSAN capacity. Already excludes the overhead
    vSAN reserves for itself, so it is smaller than the sum of the disks.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Space
    Efficiency Ratio (100 = 1.00x)</span> &mdash; Space saving from deduplication
    and compression, expressed as a ratio scaled by 100: 134 means 1.34 to 1.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Saved
    Capacity (B)</span> &mdash; Space saved by deduplication and compression, in bytes.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Front end - what VMs feel</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster DOM Client</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-client</code> on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Average read latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Average write latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Congestions</span>
    &mdash; vSAN congestion raised at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Congestions</span> &mdash; Backpressure attributed to reads.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Congestions</span> &mdash; Backpressure attributed to writes.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Unmap
    congestion</span> &mdash; Congestion attributed to unmap operations.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">OIO</span>
    &mdash; Outstanding IO: operations issued and not yet completed. Latency multiplied
    by nothing tells you why it is high -- this does. High latency with high outstanding
    IO is queueing, high latency with low outstanding IO is a slow device.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Throughput (B/s)</span> &mdash; Bytes per second read at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Throughput (B/s)</span> &mdash; Bytes per second written at this layer.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Coordination - the owner</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster DOM Owner</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-owner</code> on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Average read latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Average write latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Throughput (B/s)</span> &mdash; Bytes per second read. The owner layer names its
    throughput columns differently from the client layer; the quantity is the same.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Throughput (B/s)</span> &mdash; Bytes per second written.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">OIO</span>
    &mdash; Outstanding IO: operations issued and not yet completed. Latency multiplied
    by nothing tells you why it is high -- this does. High latency with high outstanding
    IO is queueing, high latency with low outstanding IO is a slow device.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Congestions</span>
    &mdash; vSAN congestion raised at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Congestions</span> &mdash; Backpressure attributed to reads.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Congestions</span> &mdash; Backpressure attributed to writes.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Back end - the disks</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster DOM Component Manager</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-compmgr</code> on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Average read latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Average write latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Congestions</span>
    &mdash; vSAN congestion raised at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">OIO</span>
    &mdash; Outstanding IO: operations issued and not yet completed. Latency multiplied
    by nothing tells you why it is high -- this does. High latency with high outstanding
    IO is queueing, high latency with low outstanding IO is a slow device.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Transport - RDT</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster RDT</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Network|RDT</code>
    on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Max
    Out Context Bytes (B)</span> &mdash; Maximum outbound RDT context bytes over the
    last 5 seconds.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Cluster
    Avg Lat (μs)</span> &mdash; Average round-trip latency of vSAN''s own transport
    between hosts. This sits above TCP, so it can be slow while every NIC counter
    is clean.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Cluster
    Max Lat (μs)</span> &mdash; Worst round-trip latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Cluster
    Min Lat (μs)</span> &mdash; Best round-trip latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Avg
    Out Queueing Lat (μs)</span> &mdash; Average time a message waited in the outbound
    queue before being sent. Queueing, as opposed to time on the wire.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Socket
    Min Out Bytes (Low Is Bad) (B)</span> &mdash; Lowest free space in the outbound
    socket buffer in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Socket
    Min In Bytes (Low Is Bad) (B)</span> &mdash; Lowest free space seen in the inbound
    socket buffer. <b style="font-weight:700;color:#e9edf0">Low is bad</b>, for the
    same reason.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Keepalive
    reset (Total)</span> &mdash; Cumulative count of RDT keepalive resets.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    ready delay (Total)</span> &mdash; Cumulative count of ready delays.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Host health and load</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Host Uplinks and Load</b> view. vCenter''s own metrics on each host, collected
    by the vCenter adapter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Uplink
    RX Errors, All NICs</span> &mdash; Inbound errors summed across every uplink on
    the host, counted by vCenter rather than by this pack.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Uplink
    RX Dropped, All NICs</span> &mdash; Inbound packets dropped across every uplink
    on the host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Uplink
    TX Errors, All NICs</span> &mdash; Outbound errors across every uplink on the
    host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Uplink
    TX Dropped, All NICs</span> &mdash; Outbound packets dropped across every uplink
    on the host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    Network Throughput</span> &mdash; Network throughput of the host, all uplinks
    and all traffic types, as reported by vCenter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    CPU Usage</span> &mdash; CPU usage of the host, as reported by vCenter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    CPU Contention</span> &mdash; CPU contention for the host: the proportion of time
    virtual machines waited for CPU, as reported by vCenter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
