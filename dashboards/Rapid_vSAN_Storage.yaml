- id: bccf863e-60d6-59d0-a14d-d01261618ddd
  type: TextDisplay
  title: How to read this
  coords:
    x: 1
    y: 48
    w: 12
    h: 7
  html: '<div style="font-family:''Metropolis'',''Segoe UI'',sans-serif;font-size:13px;padding:12px
    14px;background:#2b3137;color:#e9edf0;border:1px solid rgba(255,255,255,0.18);border-radius:6px">

    <h2 style="font-size:15px;font-weight:700;margin:2px 0 10px 0;color:#e9edf0">vSAN
    storage &mdash; how is each layer of storage performing?</h2>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">This screen follows storage
    from the vSAN view of each ESA disk, to the physical device beneath it, to the
    back end on each host, and then to what virtual machines see: per vSCSI controller
    and per virtual machine. Cluster capacity is shown as well.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Each drive appears in two
    panels, at the vSAN layer and at the physical device layer, so their latency columns
    can be read side by side. The physical layer panel also lists each drive''s model,
    firmware revision, controller driver and driver version. These come from vCenter
    and are properties rather than metrics, so they show the current value only.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">For the latency graphs
    where the vSAN Performance Service defines thresholds (disk device latency, vSCSI
    latency and virtual machine latency), it uses 15 ms as the warning level and 30
    ms as the critical level.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Reading any column here</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Where
    the data lives.</b> This pack creates no objects of its own. Its vSAN figures
    are metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan</code>
    on vCenter''s own cluster, host and virtual machine objects, and each panel below
    reaches them from the selected cluster through vCenter''s cluster, host and virtual
    machine relationships.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Units
    are in the column heading.</b> A heading with no unit has no unit declared for
    that metric.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">A
    blank cell is not a zero.</b> A blank cell means no value was collected for that
    column in the selected period.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Raw
    columns are cumulative counts.</b> Where a column has a Raw twin, the Raw column
    is the cumulative count and the other column is a per-interval rate.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">ESA disks - vSAN layer</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    ESA Disks</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Disk</code>
    on the vCenter host object (HostSystem), one row per disk uuid on each host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">vSAN
    Layer Avg Read Lat</span> &mdash; Read latency as vSAN sees it, above the device.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">vSAN
    Layer Avg Write Lat</span> &mdash; Write latency as vSAN sees it.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Perf
    Tier Avg Write Lat</span> &mdash; Write latency at the performance tier.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">vSAN
    Layer Read IOPS</span> &mdash; Read operations per second at the vSAN layer. Context
    -- high latency at high IOPS is a busy disk, high latency at low IOPS is a sick
    one.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">vSAN
    Layer Write IOPS</span> &mdash; Write operations per second at the vSAN layer.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">ESA disks - physical layer</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    ESA Disk Physical Layer</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Disk</code>
    on the vCenter host object (HostSystem), one row per disk uuid on each host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Model</span>
    &mdash; The drive''s model string as the storage controller reports it.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Firmware</span>
    &mdash; The drive''s firmware revision, read from the device through vCenter.
    The vSAN Performance Service does not report firmware.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Driver</span>
    &mdash; The ESXi driver module bound to the storage controller this drive sits
    behind. It belongs to the controller, so drives behind the same controller show
    the same driver. Blank when the host''s storage topology could not be read; the
    drive''s firmware is still reported.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Driver
    Version</span> &mdash; The version string of the controller''s driver, taken from
    the HCL section of the cluster health summary. Blank when that summary is unavailable;
    the driver name is still reported.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Read latency at the physical and firmware layer, below
    vSAN. The vSAN Performance Service graph definition marks 15 ms as warning and
    30 ms as critical.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Write latency at the physical and firmware layer, below
    vSAN. The vSAN Performance Service graph definition marks 15 ms as warning and
    30 ms as critical.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Device
    Avg Lat (μs)</span> &mdash; <b style="font-weight:700;color:#e9edf0">DAVG</b>
    -- time spent in the device itself. High DAVG is a slow or failing drive.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Kernel
    Avg Lat (μs)</span> &mdash; KAVG: average time a command spends in the VMkernel.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Guest
    Avg Lat (μs)</span> &mdash; GAVG: average latency seen by the guest, equal to
    DAVG plus KAVG.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Back end - per host</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Host DOM Component Manager</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-compmgr</code> on the vCenter host object (HostSystem).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Component
    congestion</span> &mdash; Congestion raised against a single component. Shown
    beside shared congestion on the same row.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shared
    congestion</span> &mdash; Shared congestion, as distinct from congestion raised
    against a single component.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Resync
    read congestion</span> &mdash; Congestion attributed to resync reads.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Average read latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    (max, read) (μs)</span> &mdash; Worst read latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Average write latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    (max, write) (μs)</span> &mdash; Worst write latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    stddev (write) (μs)</span> &mdash; Standard deviation of write latency.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">OIO</span>
    &mdash; Outstanding IO: operations issued and not yet completed. Latency multiplied
    by nothing tells you why it is high -- this does. High latency with high outstanding
    IO is queueing, high latency with low outstanding IO is a slow device.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Throughput (B/s)</span> &mdash; Bytes per second read at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Throughput (B/s)</span> &mdash; Bytes per second written at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">VM
    disk queue depth (write)</span> &mdash; Queue depth for virtual disk writes at
    the component manager.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">VM
    disk dispatched cost (write) (B/s)</span> &mdash; Cost of dispatched virtual disk
    writes, as reported by the component manager.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Namespace
    dispatched cost (write) (B/s)</span> &mdash; Cost of dispatched writes to namespace
    objects, which hold VM configuration files, as reported by the component manager.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Capacity</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster Capacity</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Capacity</code>
    on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Free
    Capacity (B)</span> &mdash; Unused vSAN capacity.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Used
    Capacity (B)</span> &mdash; Consumed vSAN capacity, after deduplication and compression.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Total
    Capacity (B)</span> &mdash; Usable vSAN capacity. Already excludes the overhead
    vSAN reserves for itself, so it is smaller than the sum of the disks.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Space
    Efficiency Ratio (100 = 1.00x)</span> &mdash; Space saving from deduplication
    and compression, expressed as a ratio scaled by 100: 134 means 1.34 to 1.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Saved
    Capacity (B)</span> &mdash; Space saved by deduplication and compression, in bytes.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">VM storage - per controller</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    VM Storage</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|vSCSI</code>
    on the vCenter virtual machine object (VirtualMachine), one row per vscsi device
    on each virtual machine.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Read latency for this virtual disk, measured at the vSAN
    layer. The vSAN Performance Service graph definition marks 15 ms as warning and
    30 ms as critical.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Write latency for this virtual disk, measured at the vSAN
    layer. The vSAN Performance Service graph definition marks 15 ms as warning and
    30 ms as critical.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">VM latency - per VM</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    VM Latency</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|VM:local</code>
    on the vCenter virtual machine object (VirtualMachine).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Read latency for this virtual disk, measured at the vSAN
    layer. The vSAN Performance Service graph definition marks 15 ms as warning and
    30 ms as critical.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Write latency for this virtual disk, measured at the vSAN
    layer. The vSAN Performance Service graph definition marks 15 ms as warning and
    30 ms as critical.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Throughput (B/s)</span> &mdash; Bytes per second read at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Throughput (B/s)</span> &mdash; Bytes per second written at this layer.</p>

    </div>'
