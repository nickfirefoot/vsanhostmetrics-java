- id: ed6f28e0-6ce2-5bfc-ab3d-d5c0dce1480a
  type: TextDisplay
  title: How to read this
  coords:
    x: 1
    y: 54
    w: 12
    h: 7
  html: '<div style="font-family:''Metropolis'',''Segoe UI'',sans-serif;font-size:13px;padding:12px
    14px;background:#2b3137;color:#e9edf0;border:1px solid rgba(255,255,255,0.18);border-radius:6px">

    <h2 style="font-size:15px;font-weight:700;margin:2px 0 10px 0;color:#e9edf0">vSAN
    network &mdash; how is each layer of the network path behaving?</h2>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">vSAN traffic crosses four
    layers, and each has a panel here from the top down: <b style="font-weight:700;color:#e9edf0">RDT</b>,
    vSAN''s own transport; <b style="font-weight:700;color:#e9edf0">TCP</b>; the VMkernel
    network adapter (<b style="font-weight:700;color:#e9edf0">vmknic</b>); and the
    <b style="font-weight:700;color:#e9edf0">physical NIC</b>. Two further panels
    show every uplink as vCenter counts it, and cluster membership (CMMDS) traffic.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Most columns show the highest
    value in the selected period, so a short burst inside a five-minute interval is
    not averaged away. Columns that behave differently, such as minimums, current
    values and cumulative counts, are described in the reference below.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">High
    pNIC error rate</b> shows the eight counters behind vCenter''s built-in alarm
    <i style="font-style:italic;color:#e9edf0">High pNic error rate detected</i> (alarm-261):
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">rxCrcErr</code>,
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">rxErr</code>,
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">rxFifoErr</code>,
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">rxMissErr</code>,
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">rxOvErr</code>,
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">txCarErr</code>,
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">txErr</code>
    and <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">pauseCount</code>,
    with the cumulative <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">rxMissErrRaw</code>.
    The alarm is raised when the vSAN health test for any of those counters reports
    yellow or red. <b style="font-weight:700;color:#e9edf0">pNIC stats - every counter</b>
    shows the full set of pNIC columns.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">The pNIC panels list the
    uplinks the vSAN Performance Service reports on. <b style="font-weight:700;color:#e9edf0">Every
    uplink - from vCenter</b> shows all uplinks on each host, counted by vCenter.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Reading any column here</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Where
    the data lives.</b> This pack creates no objects of its own. Its vSAN figures
    are metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan</code>
    on vCenter''s own cluster, host and virtual machine objects, and each panel below
    reaches them from the selected cluster through vCenter''s cluster, host and virtual
    machine relationships.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Units
    are in the column heading.</b> A heading with no unit has no unit declared for
    that metric.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">A
    blank cell is not a zero.</b> A blank cell means no value was collected for that
    column in the selected period.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Raw
    columns are cumulative counts.</b> Where a column has a Raw twin, the Raw column
    is the cumulative count and the other column is a per-interval rate.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">RDT latencies - per vmknic</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    vmknic RDT Latency</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Network|VMkernel
    NIC</code> on the vCenter host object (HostSystem), one row per vmkernel nic on
    each host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Max
    Out Context Bytes (B)</span> &mdash; Maximum outbound RDT context bytes over the
    last 5 seconds.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">VNIC
    Avg Lat (μs)</span> &mdash; Average round-trip latency of vSAN''s own transport
    between hosts. This sits above TCP, so it can be slow while every NIC counter
    is clean.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Cluster
    Max Lat (μs)</span> &mdash; Worst round-trip latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Cluster
    Min Lat (μs)</span> &mdash; Best round-trip latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Avg
    Out Queueing Lat (μs)</span> &mdash; Average time a message waited in the outbound
    queue before being sent. Queueing, as opposed to time on the wire.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Max
    Out Queueing Lat (μs)</span> &mdash; Worst outbound queueing delay in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Socket
    Min Out Bytes (Low Is Bad) (B)</span> &mdash; Lowest free space in the outbound
    socket buffer in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Socket
    Min In Bytes (Low Is Bad) (B)</span> &mdash; Lowest free space seen in the inbound
    socket buffer. <b style="font-weight:700;color:#e9edf0">Low is bad</b>, for the
    same reason.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Keepalive
    reset (Total)</span> &mdash; Cumulative count of RDT keepalive resets.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    ready delay (Total)</span> &mdash; Cumulative count of ready delays.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">TCP error types</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Host TCP Health</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Network|TCP/IP
    Stack</code> on the vCenter host object (HostSystem), one row per tcp/ip stack
    on each host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">TCP
    TX retransmit (rate)</span> &mdash; Segments this host retransmitted because they
    were not acknowledged.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">TCP
    RX errors (rate)</span> &mdash; Inbound TCP segments rejected as erroneous.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Received
    Duplicate Acknowledge Rate (%)</span> &mdash; Duplicate acknowledgements received
    by this host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Received
    Duplicate Packets Rate (%)</span> &mdash; Duplicate packets received: data that
    arrived more than once.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Received
    Out-of-order Packets Rate (%)</span> &mdash; Packets received out of order.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Sack
    Received Blocks Rate (%)</span> &mdash; SACK (selective acknowledgement) blocks
    received.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Sack
    Send Blocks Rate (%)</span> &mdash; SACK (selective acknowledgement) blocks sent.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Sack
    Rexmits Rate (%)</span> &mdash; Segments retransmitted on the basis of SACK information.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Timeout
    Drop Rate (%)</span> &mdash; Established connections dropped because the retransmission
    timer expired.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Half
    Open Drop Rate (%)</span> &mdash; Half-open drop rate for the VMkernel network
    adapter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">TCP
    Send Zero Window (Total)</span> &mdash; Times this host advertised a zero receive
    window to a peer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">TCP
    Errors (Total) (%)</span> &mdash; Total TCP errors recorded by this host''s stack
    since boot.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">vmknic - the kernel port</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    vmknic</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Network|VMkernel
    NIC</code> on the vCenter host object (HostSystem), one row per vmkernel nic on
    each host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Out
    Packet Discard Rate (%)</span> &mdash; Proportion of outbound packets discarded
    at the host network layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">In
    Packet Discard Rate (%)</span> &mdash; Proportion of inbound packets discarded
    at the host network layer, across all of this host''s vSAN traffic rather than
    one uplink.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Throughput
    In (B/s)</span> &mdash; Inbound throughput for this host''s vSAN traffic. Context
    for the error columns.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Throughput
    Out (B/s)</span> &mdash; Outbound throughput for this host''s vSAN traffic.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">In
    Packets Per Second</span> &mdash; Inbound packets per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Out
    Packets Per Second</span> &mdash; Outbound packets per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Port
    RX packets</span> &mdash; Packets received on this kernel port.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Port
    TX packets (Total)</span> &mdash; Packets transmitted on this vSwitch port.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">In
    Packet Drop Rate (vSwitch port) (%)</span> &mdash; Inbound packets dropped by
    the vSwitch for this port.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Out
    Packet Drop Rate (vSwitch port) (%)</span> &mdash; The vSwitch discarded outbound
    packets for this port.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">High pNIC error rate</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    High pNIC Error Rate</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Network|Physical
    NIC</code> on the vCenter host object (HostSystem), one row per physical nic on
    each host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX CRC Error (%)</span> &mdash; The frame arrived damaged and failed its checksum.
    One of the eight counters behind vCenter''s built-in alarm <i style="font-style:italic;color:#e9edf0">High
    pNic error rate detected</i> (alarm-261), which is raised when the vSAN health
    test for any of them reports yellow or red.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX Generic Error (%)</span> &mdash; Receive errors not attributed to a more specific
    counter. Useful as a catch-all; look to the specific counters first.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX FIFO Error (%)</span> &mdash; The NIC''s own on-chip buffer overflowed before
    it could move packets across PCIe into host memory. The NIC could not hand data
    over fast enough.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX Missed Error (%)</span> &mdash; The NIC''s receive ring had no free descriptor,
    so the packet was dropped before the driver saw it. Distinct from a drop (discarded
    higher up) and an error (arrived damaged). This table covers the uplinks the vSAN
    Performance Service reports on, which are the uplinks carrying vSAN traffic.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX Buffer Overflow Error (%)</span> &mdash; Receive buffer overflow errors on
    the physical NIC.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    TX Carrier Error (%)</span> &mdash; Carrier lost while transmitting.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    TX Generic Error (%)</span> &mdash; Transmit errors not attributed to a more specific
    counter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNic
    802.3x Pause Rate (%)</span> &mdash; 802.3x pause frames, the flow control a host
    and a switch use to ask each other to slow down. The counter has no direction:
    it does not separate pause frames received from pause frames sent. Pause frames
    are exchanged only when flow control is enabled on the uplink; an uplink''s settings
    can be listed with <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">esxcli
    network nic pauseParams list</code>.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX Missed Error (Total)</span> &mdash; Cumulative count of missed receive errors.
    The column of the same name without Raw is the per-interval rate.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">pNIC stats - every counter</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    pNIC Errors</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Network|Physical
    NIC</code> on the vCenter host object (HostSystem), one row per physical nic on
    each host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX Missed Error (%)</span> &mdash; The NIC''s receive ring had no free descriptor,
    so the packet was dropped before the driver saw it. Distinct from a drop (discarded
    higher up) and an error (arrived damaged). This table covers the uplinks the vSAN
    Performance Service reports on, which are the uplinks carrying vSAN traffic.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX CRC Error (%)</span> &mdash; The frame arrived damaged and failed its checksum.
    One of the eight counters behind vCenter''s built-in alarm <i style="font-style:italic;color:#e9edf0">High
    pNic error rate detected</i> (alarm-261), which is raised when the vSAN health
    test for any of them reports yellow or red.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX Generic Error (%)</span> &mdash; Receive errors not attributed to a more specific
    counter. Useful as a catch-all; look to the specific counters first.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX FIFO Error (%)</span> &mdash; The NIC''s own on-chip buffer overflowed before
    it could move packets across PCIe into host memory. The NIC could not hand data
    over fast enough.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX Buffer Overflow Error (%)</span> &mdash; Receive buffer overflow errors on
    the physical NIC.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    TX Carrier Error (%)</span> &mdash; Carrier lost while transmitting.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    TX Generic Error (%)</span> &mdash; Transmit errors not attributed to a more specific
    counter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">In
    Packet Drop Rate (pNIC port) (%)</span> &mdash; Inbound packets dropped by the
    vSwitch for this port.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Out
    Packet Drop Rate (pNIC port) (%)</span> &mdash; The vSwitch discarded outbound
    packets for this port.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNic
    802.3x Pause Rate (%)</span> &mdash; 802.3x pause frames, the flow control a host
    and a switch use to ask each other to slow down. The counter has no direction:
    it does not separate pause frames received from pause frames sent. Pause frames
    are exchanged only when flow control is enabled on the uplink; an uplink''s settings
    can be listed with <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">esxcli
    network nic pauseParams list</code>.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">IO
    chain drops</span> &mdash; Packets dropped in the ESXi IO chain.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">IO
    chain RX drops</span> &mdash; Inbound packets dropped in the ESXi IO chain.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">IO
    chain TX drops</span> &mdash; Outbound packets dropped in the ESXi IO chain.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX Missed Error (Total)</span> &mdash; Cumulative count of missed receive errors.
    The column of the same name without Raw is the per-interval rate.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    RX CRC Error (Total)</span> &mdash; Cumulative count of CRC errors. The column
    of the same name without Raw is the per-interval rate.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">pNIC
    PFC Count (Total)</span> &mdash; Cumulative count of priority flow control frames.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Port
    TX packets (Total)</span> &mdash; Packets transmitted on this vSwitch port.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Every uplink - from vCenter</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Host Uplinks and Load</b> view. vCenter''s own metrics on each host, collected
    by the vCenter adapter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Uplink
    RX Errors, All NICs</span> &mdash; Inbound errors summed across every uplink on
    the host, counted by vCenter rather than by this pack.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Uplink
    RX Dropped, All NICs</span> &mdash; Inbound packets dropped across every uplink
    on the host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Uplink
    TX Errors, All NICs</span> &mdash; Outbound errors across every uplink on the
    host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Uplink
    TX Dropped, All NICs</span> &mdash; Outbound packets dropped across every uplink
    on the host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    Network Throughput</span> &mdash; Network throughput of the host, all uplinks
    and all traffic types, as reported by vCenter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    CPU Usage</span> &mdash; CPU usage of the host, as reported by vCenter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    CPU Contention</span> &mdash; CPU contention for the host: the proportion of time
    virtual machines waited for CPU, as reported by vCenter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    Memory Consumed</span> &mdash; Proportion of host memory consumed.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    Memory Swap-In Rate</span> &mdash; Rate at which the host reads swapped memory
    back from disk, as reported by vCenter.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    Uptime</span> &mdash; Time since the host last booted.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Hardware
    Sensor Status</span> &mdash; Overall hardware sensor health, as the host''s own
    sensors report it.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Connectivity
    Issues, Critical</span> &mdash; Count of critical connectivity findings against
    this host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Utilisation
    Issues, Critical</span> &mdash; Count of critical utilisation findings against
    this host.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">CMMDS - cluster membership</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    CMMDS Network</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Network|Host</code>
    on the vCenter host object (HostSystem).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Out</span> &mdash; Cluster directory messages sent by this host. CMMDS is how
    hosts agree on cluster membership and object placement; if it cannot talk, the
    cluster partitions, and that happens before any IO metric moves.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    In</span> &mdash; Cluster directory messages received.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Out Throughput (B/s)</span> &mdash; CMMDS network read outbound throughput, in
    bytes per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    In Throughput (B/s)</span> &mdash; Bytes per second of inbound cluster directory
    traffic.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Group
    Out Unicast</span> &mdash; Unicast membership messages sent.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Group
    In</span> &mdash; Membership messages received.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Group
    Out Unicast Throughput (B/s)</span> &mdash; Bytes per second of outbound unicast
    membership traffic.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Group
    In Throughput (B/s)</span> &mdash; Bytes per second of inbound membership traffic.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Group
    Out Multicast</span> &mdash; Multicast membership messages sent.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Group
    Out Multicast Throughput (B/s)</span> &mdash; Bytes per second of outbound multicast
    membership traffic. Expected to be zero.</p>

    </div>'
- id: b73eee63-905d-5858-af80-53be68b6c8a2
  type: TextDisplay
  title: Complete the install
  coords:
    x: 1
    y: 61
    w: 12
    h: 9
  html: '<div style="font-family:''Metropolis'',''Segoe UI'',sans-serif;font-size:13px;line-height:1.45;padding:12px 14px;background:#2b3137;color:#e9edf0;border-radius:6px;border:1px solid #4a535d">
<h3 style="font-size:15px;margin:4px 0 10px 0;color:#ffffff">Complete the install</h3>
<ol style="margin:4px 0 4px 20px;padding:0;color:#e9edf0">
<li style="margin:5px 0;line-height:1.45;color:#e9edf0">Go to Administration &rarr; Integrations &rarr; <b style="font-weight:700;color:#ffffff">Accounts</b> tab &rarr; <b style="font-weight:700;color:#ffffff">ADD</b> &rarr; choose the <b style="font-weight:700;color:#ffffff">vSAN Host Metrics</b> tile.</li>
<li style="margin:5px 0;line-height:1.45;color:#e9edf0">Fill in <b style="font-weight:700;color:#ffffff">Add Account - vSAN Host Metrics</b>: <b style="font-weight:700;color:#ffffff">Name</b>; <b style="font-weight:700;color:#ffffff">vCenter Server</b>; <b style="font-weight:700;color:#ffffff">vCenter username</b>; <b style="font-weight:700;color:#ffffff">Credential</b> &rarr; <b style="font-weight:700;color:#ffffff">+</b> &rarr; <b style="font-weight:700;color:#ffffff">Credential name</b> and <b style="font-weight:700;color:#ffffff">vCenter password</b> &rarr; <b style="font-weight:700;color:#ffffff">OK</b>; <b style="font-weight:700;color:#ffffff">Verify vCenter certificate</b>; <b style="font-weight:700;color:#ffffff">Cloud Proxy / Group</b> (9.1.1) or <b style="font-weight:700;color:#ffffff">Collector / Group</b> (8.18). The vCenter port is under <b style="font-weight:700;color:#ffffff">Advanced Settings</b> (default 443).</li>
<li style="margin:5px 0;line-height:1.45;color:#e9edf0">Click <b style="font-weight:700;color:#ffffff">VALIDATE CONNECTION</b> and accept the vCenter certificate when prompted. Then click <b style="font-weight:700;color:#ffffff">ADD</b>.</li>
<li style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#ffd79a">After installing or upgrading the pak:</b> Administration &rarr; Integrations &rarr; Accounts &rarr; expand <b style="font-weight:700;color:#ffffff">vSAN Host Metrics</b> &rarr; check the account''s <b style="font-weight:700;color:#ffffff">Status</b>. If it isn''t collecting, use &#8942; on the account row &rarr; <b style="font-weight:700;color:#ffffff">Start Collecting</b>.</li>
<li style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#ffffff">Requirements:</b> vCenter 8.0 U3 or later, or 9.0 or later; a vCenter account that can read vSAN performance data.</li>
</ol>
<p style="margin:5px 0;line-height:1.45;color:#e9edf0">No policy or super-metric changes are needed.</p>
</div>'
