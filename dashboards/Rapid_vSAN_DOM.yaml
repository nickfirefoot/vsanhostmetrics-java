    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Per host - client</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
