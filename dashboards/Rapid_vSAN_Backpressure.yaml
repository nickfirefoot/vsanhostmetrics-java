- id: 433a7e7f-24ac-510a-b020-47cfd4e08828
  type: TextDisplay
  title: How to read this
  coords:
    x: 1
    y: 51
    w: 12
    h: 7
  html: '<div style="font-family:''Metropolis'',''Segoe UI'',sans-serif;font-size:13px;padding:12px
    14px;background:#2b3137;color:#e9edf0;border:1px solid rgba(255,255,255,0.18);border-radius:6px">

    <h2 style="font-size:15px;font-weight:700;margin:2px 0 10px 0;color:#e9edf0">Backpressure
    &mdash; which layer is reporting congestion?</h2>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Congestion is vSAN''s mechanism
    for slowing IO when a layer cannot absorb the load offered to it. It is reported
    separately by the client, the owner and the component manager, and by type.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">The panels run from the
    whole cluster to individual hosts. <b style="font-weight:700;color:#e9edf0">Cluster
    - front end congestion</b> and <b style="font-weight:700;color:#e9edf0">Cluster
    - owner congestion</b> are cluster level. <b style="font-weight:700;color:#e9edf0">Back
    end - device vs host</b> and <b style="font-weight:700;color:#e9edf0">Owner -
    reclaim and rebuild</b> are per host. <b style="font-weight:700;color:#e9edf0">Adaptive
    network shaping</b> shows the network scheduler''s counters per host. The two
    transport panels show RDT for the cluster and per host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Client congestion is reported
    as <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">congestion</code>,
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">readCongestion</code>,
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">writeCongestion</code>
    and <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">unmapCongestion</code>.
    The owner reports <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">segCleanerUnmapCongestion</code>
    and <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">recoveryWriteCongestion</code>.
    The component manager reports <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">componentCongestion</code>,
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">sharedCongestion</code>
    and <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">resyncReadCongestion</code>.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">The transport panels show
    RDT latency alongside <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">kaReset</code>,
    <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">txSbSpaceMin</code>
    and <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">rxSbSpaceMin</code>.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Reading any column here</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Where
    the data lives.</b> This pack creates no objects of its own. Its vSAN figures
    are metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan</code>
    on vCenter''s own cluster, host and virtual machine objects, and each panel below
    reaches them from the selected cluster through vCenter''s cluster, host and virtual
    machine relationships.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Units
    are in the column heading.</b> A heading with no unit has no unit declared for
    that metric.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">A
    blank cell is not a zero.</b> A blank cell means no value was collected for that
    column in the selected period.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Raw
    columns are cumulative counts.</b> Where a column has a Raw twin, the Raw column
    is the cumulative count and the other column is a per-interval rate.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Cluster - front end congestion</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster DOM Client</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-client</code> on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Average read latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Average write latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Congestions</span>
    &mdash; vSAN congestion raised at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Congestions</span> &mdash; Backpressure attributed to reads.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Congestions</span> &mdash; Backpressure attributed to writes.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Unmap
    congestion</span> &mdash; Congestion attributed to unmap operations.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">OIO</span>
    &mdash; Outstanding IO: operations issued and not yet completed. Latency multiplied
    by nothing tells you why it is high -- this does. High latency with high outstanding
    IO is queueing, high latency with low outstanding IO is a slow device.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Throughput (B/s)</span> &mdash; Bytes per second read at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Throughput (B/s)</span> &mdash; Bytes per second written at this layer.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Cluster - owner congestion</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster DOM Owner</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-owner</code> on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Average read latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Average write latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Throughput (B/s)</span> &mdash; Bytes per second read. The owner layer names its
    throughput columns differently from the client layer; the quantity is the same.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Throughput (B/s)</span> &mdash; Bytes per second written.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">OIO</span>
    &mdash; Outstanding IO: operations issued and not yet completed. Latency multiplied
    by nothing tells you why it is high -- this does. High latency with high outstanding
    IO is queueing, high latency with low outstanding IO is a slow device.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Congestions</span>
    &mdash; vSAN congestion raised at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Congestions</span> &mdash; Backpressure attributed to reads.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Congestions</span> &mdash; Backpressure attributed to writes.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Back end - device vs host</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Host DOM Component Manager</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-compmgr</code> on the vCenter host object (HostSystem).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Component
    congestion</span> &mdash; Congestion raised against a single component. Shown
    beside shared congestion on the same row.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shared
    congestion</span> &mdash; Shared congestion, as distinct from congestion raised
    against a single component.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Resync
    read congestion</span> &mdash; Congestion attributed to resync reads.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Average read latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    (max, read) (μs)</span> &mdash; Worst read latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Average write latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    (max, write) (μs)</span> &mdash; Worst write latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    stddev (write) (μs)</span> &mdash; Standard deviation of write latency.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">OIO</span>
    &mdash; Outstanding IO: operations issued and not yet completed. Latency multiplied
    by nothing tells you why it is high -- this does. High latency with high outstanding
    IO is queueing, high latency with low outstanding IO is a slow device.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Throughput (B/s)</span> &mdash; Bytes per second read at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Throughput (B/s)</span> &mdash; Bytes per second written at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">VM
    disk queue depth (write)</span> &mdash; Queue depth for virtual disk writes at
    the component manager.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">VM
    disk dispatched cost (write) (B/s)</span> &mdash; Cost of dispatched virtual disk
    writes, as reported by the component manager.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Namespace
    dispatched cost (write) (B/s)</span> &mdash; Cost of dispatched writes to namespace
    objects, which hold VM configuration files, as reported by the component manager.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Owner - reclaim and rebuild</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Host DOM Owner</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-owner</code> on the vCenter host object (HostSystem).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Seg
    clean unmap congestion</span> &mdash; Congestion attributed to segment cleaner
    unmap work.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Resync
    Read Congestions</span> &mdash; Congestion reported under the id recoveryWriteCongestion.
    The Performance Service publishes it under the name "Resync Read Congestions",
    and the column label is that Broadcom name.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Average write latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    (max, write) (μs)</span> &mdash; Worst write latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    stddev (write) (μs)</span> &mdash; Standard deviation of write latency.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Average read latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    (max, read) (μs)</span> &mdash; Worst read latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">High
    outstanding IO duration % (write)</span> &mdash; High outstanding IO duration
    for writes, as a percentage of the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Owner2
    pc commit latency avg (μs)</span> &mdash; Average latency, in microseconds, of
    the owner''s 2PC (two-phase commit) of a write.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    leaf owner latency local (μs)</span> &mdash; Write latency for replicas on this
    host.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    leaf owner latency remote (μs)</span> &mdash; Write latency for replicas on other
    hosts.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    leaf owner latency local (μs)</span> &mdash; Read latency served from this host''s
    own disks.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    leaf owner latency remote (μs)</span> &mdash; Read latency served from another
    host''s disks.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Server
    switch count</span> &mdash; Cumulative count of server switches.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">IOPS</span>
    &mdash; Total operations per second at this layer, reads and writes together.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">OIO</span>
    &mdash; Outstanding IO: operations issued and not yet completed. Latency multiplied
    by nothing tells you why it is high -- this does. High latency with high outstanding
    IO is queueing, high latency with low outstanding IO is a slow device.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Adaptive network shaping</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Host DOM Owner Scheduler</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-owner</code> on the vCenter host object (HostSystem).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    rolling avg lat (μs)</span> &mdash; Rolling average latency, in microseconds,
    reported by adaptive network shaping.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    guest lt latency (μs)</span> &mdash; Guest long-tail latency, in microseconds,
    reported by adaptive network shaping.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    low band thresh (μs)</span> &mdash; Latency threshold, in microseconds, for the
    low band.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    low band</span> &mdash; Number of times this host was placed in the low band.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    mid band</span> &mdash; Number of times this host was placed in the middle band.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    low band sec (s)</span> &mdash; Seconds spent in the low band.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    mid band sec (s)</span> &mdash; Seconds spent in the middle band.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    low to mid band</span> &mdash; Transitions from the low band to the middle band.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    mid to low band</span> &mdash; Transitions from the middle band to the low band.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    seen total tp (B/s)</span> &mdash; Total throughput observed by adaptive network
    shaping.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    seen non resync tp (B/s)</span> &mdash; Throughput observed by adaptive network
    shaping, excluding resync traffic.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Shaping
    controller IOPS limit</span> &mdash; Controller IOPS limit reported by adaptive
    network shaping.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Transport - cluster</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster RDT</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Network|RDT</code>
    on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Max
    Out Context Bytes (B)</span> &mdash; Maximum outbound RDT context bytes over the
    last 5 seconds.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Cluster
    Avg Lat (μs)</span> &mdash; Average round-trip latency of vSAN''s own transport
    between hosts. This sits above TCP, so it can be slow while every NIC counter
    is clean.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Cluster
    Max Lat (μs)</span> &mdash; Worst round-trip latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Cluster
    Min Lat (μs)</span> &mdash; Best round-trip latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Avg
    Out Queueing Lat (μs)</span> &mdash; Average time a message waited in the outbound
    queue before being sent. Queueing, as opposed to time on the wire.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Socket
    Min Out Bytes (Low Is Bad) (B)</span> &mdash; Lowest free space in the outbound
    socket buffer in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Socket
    Min In Bytes (Low Is Bad) (B)</span> &mdash; Lowest free space seen in the inbound
    socket buffer. <b style="font-weight:700;color:#e9edf0">Low is bad</b>, for the
    same reason.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Keepalive
    reset (Total)</span> &mdash; Cumulative count of RDT keepalive resets.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    ready delay (Total)</span> &mdash; Cumulative count of ready delays.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Transport - per host</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    RDT Transport Per Host</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Network|Host</code>
    on the vCenter host object (HostSystem).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Max
    Out Context Bytes (B)</span> &mdash; Maximum outbound RDT context bytes over the
    last 5 seconds.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    Avg Lat (μs)</span> &mdash; Average round-trip latency of vSAN''s own transport
    between hosts. This sits above TCP, so it can be slow while every NIC counter
    is clean.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    Max Lat (μs)</span> &mdash; Worst round-trip latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Host
    Min Lat (μs)</span> &mdash; Best round-trip latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Avg
    Out Queueing Lat (μs)</span> &mdash; Average time a message waited in the outbound
    queue before being sent. Queueing, as opposed to time on the wire.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Max
    Out Queueing Lat (μs)</span> &mdash; Worst outbound queueing delay in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Socket
    Min Out Bytes (Low Is Bad) (B)</span> &mdash; Lowest free space in the outbound
    socket buffer in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Socket
    Min In Bytes (Low Is Bad) (B)</span> &mdash; Lowest free space seen in the inbound
    socket buffer. <b style="font-weight:700;color:#e9edf0">Low is bad</b>, for the
    same reason.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Socket
    Max In Bytes (B)</span> &mdash; Highest free space seen inbound. Context for the
    minimum beside it.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Keepalive
    reset (Total)</span> &mdash; Cumulative count of RDT keepalive resets.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    ready delay (Total)</span> &mdash; Cumulative count of ready delays.</p>

    </div>'
