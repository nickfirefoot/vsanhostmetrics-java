- id: ad466363-6efb-5107-8d21-02d991eb09ab
  type: TextDisplay
  title: How to read this
  coords:
    x: 1
    y: 43
    w: 12
    h: 7
  html: '<div style="font-family:''Metropolis'',''Segoe UI'',sans-serif;font-size:13px;padding:12px
    14px;background:#2b3137;color:#e9edf0;border:1px solid rgba(255,255,255,0.18);border-radius:6px">

    <h2 style="font-size:15px;font-weight:700;margin:2px 0 10px 0;color:#e9edf0">Resync
    &mdash; how much rebuild work is outstanding?</h2>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">A resync is vSAN restoring
    data to the redundancy its storage policy asks for. The top table counts resync
    jobs by state: pending, running, suspended and in flight.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Rebuild
    IO rates</b> and <b style="font-weight:700;color:#e9edf0">Back end during rebuild</b>
    show resync and recovery IO and the component manager''s latency at cluster level.
    <b style="font-weight:700;color:#e9edf0">Segment cleaning</b> shows the segment
    cleaner''s operations, latency and throughput for each host.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Reading any column here</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Where
    the data lives.</b> This pack creates no objects of its own. Its vSAN figures
    are metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan</code>
    on vCenter''s own cluster, host and virtual machine objects, and each panel below
    reaches them from the selected cluster through vCenter''s cluster, host and virtual
    machine relationships.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Units
    are in the column heading.</b> A heading with no unit has no unit declared for
    that metric.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">A
    blank cell is not a zero.</b> A blank cell means no value was collected for that
    column in the selected period.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#e9edf0">Raw
    columns are cumulative counts.</b> Where a column has a Raw twin, the Raw column
    is the cumulative count and the other column is a per-interval rate.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Jobs outstanding - the risk</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster Resync Jobs</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-owner</code> on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    pending resync jobs</span> &mdash; Resync jobs queued and not yet started.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    running resync jobs</span> &mdash; Resync jobs currently running.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    suspended resync jobs</span> &mdash; Resync jobs currently suspended.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    inflight priority resync jobs</span> &mdash; Priority resync jobs in flight.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    inflight shared resync jobs</span> &mdash; Shared resync jobs in flight.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    pending decom resync jobs</span> &mdash; Pending resync jobs created by decommissioning.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    pending full resync jobs</span> &mdash; Pending full resync jobs.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    running full resync jobs</span> &mdash; Running full resync jobs.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Resync
    parallelism (average)</span> &mdash; Average number of resync operations running
    in parallel.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    complete resync ops</span> &mdash; Cumulative count of completed resync operations.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Num
    complete full resync ops</span> &mdash; Cumulative count of completed full resync
    operations.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Resync
    Read IOPS</span> &mdash; Read operations per second performed to rebuild redundancy.
    <b style="font-weight:700;color:#e9edf0">Zero unless something is actually resyncing</b>,
    which is the normal and desirable reading.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Recovery
    Write IOPS</span> &mdash; Write operations per second performed to restore redundancy
    -- the other half of a rebuild.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Rebuild IO rates</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster Resync</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-compmgr</code> on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Resync
    Read IOPS</span> &mdash; Read operations per second performed to rebuild redundancy.
    <b style="font-weight:700;color:#e9edf0">Zero unless something is actually resyncing</b>,
    which is the normal and desirable reading.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Resync
    Read Throughput (B/s)</span> &mdash; Bytes per second read for rebuild.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Resync
    Read Lat (μs)</span> &mdash; Average latency of rebuild reads.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Recovery
    Write IOPS</span> &mdash; Write operations per second performed to restore redundancy
    -- the other half of a rebuild.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Recovery
    Write Throughput (B/s)</span> &mdash; Bytes per second written to restore redundancy.
    Divide the outstanding work by this to estimate how long a rebuild has left.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Recovery
    Write Lat (μs)</span> &mdash; Average latency of recovery writes.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Back end during rebuild</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Cluster DOM Component Manager</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-compmgr</code> on the vCenter cluster object (ClusterComputeResource).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    Lat (μs)</span> &mdash; Average read latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    Lat (μs)</span> &mdash; Average write latency at this layer. For the client, component
    manager and zDOM layers the vSAN Performance Service graph definition marks 15
    ms as warning and 30 ms as critical; it defines no threshold for the owner layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Congestions</span>
    &mdash; vSAN congestion raised at this layer.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">OIO</span>
    &mdash; Outstanding IO: operations issued and not yet completed. Latency multiplied
    by nothing tells you why it is high -- this does. High latency with high outstanding
    IO is queueing, high latency with low outstanding IO is a slow device.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Read
    IOPS</span> &mdash; Read operations per second.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Write
    IOPS</span> &mdash; Write operations per second.</p>

    <h3 style="font-size:13px;font-weight:700;margin:16px 0 6px 0;color:#e9edf0;border-bottom:1px
    solid rgba(255,255,255,0.18);padding-bottom:3px">Segment cleaning</h3>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0">Renders the <b style="font-weight:700;color:#e9edf0">vSAN
    Segment Cleaning Per Host</b> view. Metrics under <code style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#8fd3ff">cptvsan|Storage
    I/O:dom-owner</code> on the vCenter host object (HostSystem).</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">IOPS
    seg cleaner unmap</span> &mdash; Operations per second performed by the segment
    cleaner.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    avg seg cleaner unmap (μs)</span> &mdash; Average segment cleaner unmap latency.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    max seg cleaner unmap (μs)</span> &mdash; Worst segment cleaner unmap latency
    in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    stddev seg cleaner unmap (μs)</span> &mdash; Standard deviation of segment cleaner
    unmap latency.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Throughput
    seg cleaner unmap (B/s)</span> &mdash; Bytes per second moved by the segment cleaner.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Seg
    clean unmap leaf owner max lat (μs)</span> &mdash; Segment cleaner unmap leaf-owner
    latency: the maximum of the averages, in microseconds.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Unmap
    IOPS</span> &mdash; Space-reclamation operations per second, including those originated
    by guests trimming their filesystems.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Unmap
    Lat (μs)</span> &mdash; Average latency of unmap operations.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Lat
    max unmap (μs)</span> &mdash; Worst unmap latency in the interval.</p>

    <p style="margin:5px 0;line-height:1.45;color:#e9edf0"><span style="font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fd3ff">Unmap
    count</span> &mdash; Cumulative count of unmap operations.</p>

    </div>'
- id: 2ce400dd-af97-51a1-87a5-6bc20fd6fdc8
  type: TextDisplay
  title: Complete the install
  coords:
    x: 1
    y: 50
    w: 12
    h: 9
  html: '<div style="font-family:''Metropolis'',''Segoe UI'',sans-serif;font-size:13px;line-height:1.45;padding:12px 14px;background:#2b3137;color:#e9edf0;border-radius:6px;border:1px solid #4a535d">
<h3 style="font-size:15px;margin:4px 0 10px 0;color:#ffffff">Complete the install</h3>
<ol style="margin:4px 0 4px 20px;padding:0;color:#e9edf0">
<li style="margin:5px 0;line-height:1.45;color:#e9edf0">Go to Administration &rarr; Integrations &rarr; <b style="font-weight:700;color:#ffffff">Accounts</b> tab &rarr; <b style="font-weight:700;color:#ffffff">ADD</b> &rarr; choose the <b style="font-weight:700;color:#ffffff">vSAN Host Metrics</b> tile.</li>
<li style="margin:5px 0;line-height:1.45;color:#e9edf0">Fill in <b style="font-weight:700;color:#ffffff">Add Account - vSAN Host Metrics</b>: <b style="font-weight:700;color:#ffffff">Name</b>; <b style="font-weight:700;color:#ffffff">vCenter Server</b>; <b style="font-weight:700;color:#ffffff">vCenter username</b>; <b style="font-weight:700;color:#ffffff">Credential</b> &rarr; <b style="font-weight:700;color:#ffffff">+</b> &rarr; <b style="font-weight:700;color:#ffffff">Credential name</b> and <b style="font-weight:700;color:#ffffff">vCenter password</b> &rarr; <b style="font-weight:700;color:#ffffff">OK</b>; <b style="font-weight:700;color:#ffffff">Verify vCenter certificate</b>; <b style="font-weight:700;color:#ffffff">Cloud Proxy / Group</b> (9.1.1) or <b style="font-weight:700;color:#ffffff">Collector / Group</b> (8.18). The vCenter port is under <b style="font-weight:700;color:#ffffff">Advanced Settings</b> (default 443).</li>
<li style="margin:5px 0;line-height:1.45;color:#e9edf0">Click <b style="font-weight:700;color:#ffffff">VALIDATE CONNECTION</b> and accept the vCenter certificate when prompted. Then click <b style="font-weight:700;color:#ffffff">ADD</b>.</li>
<li style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#ffd79a">After installing or upgrading the pak:</b> Administration &rarr; Integrations &rarr; Accounts &rarr; expand <b style="font-weight:700;color:#ffffff">vSAN Host Metrics</b> &rarr; check the account''s <b style="font-weight:700;color:#ffffff">Status</b>. If it isn''t collecting, use &#8942; on the account row &rarr; <b style="font-weight:700;color:#ffffff">Start Collecting</b>.</li>
<li style="margin:5px 0;line-height:1.45;color:#e9edf0"><b style="font-weight:700;color:#ffffff">Requirements:</b> vCenter 8.0 U3 or later, or 9.0 or later; a vCenter account that can read vSAN performance data.</li>
</ol>
<p style="margin:5px 0;line-height:1.45;color:#e9edf0">No policy or super-metric changes are needed.</p>
</div>'
