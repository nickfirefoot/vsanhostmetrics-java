<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 592" width="980" height="592" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Where the vSAN Host Metrics data lives">
<title>Where the vSAN Host Metrics data lives</title>
<rect width="980" height="592" rx="8" fill="#2b3137"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e9edf0"/></marker></defs>
<rect x="190" y="20" width="600" height="54" rx="6" fill="#363d45" stroke="#6b7782" stroke-dasharray="5 4"/>
<text x="490" y="43" text-anchor="middle" font-size="15" font-weight="700" fill="#e9edf0">vSAN Host Metrics adapter instance</text>
<text x="490" y="63" text-anchor="middle" font-size="12" fill="#b6bfc8">the only object this pack creates; it pushes metrics onto the objects vCenter owns</text>
<line x1="490" y1="74" x2="170" y2="124" stroke="#e9edf0" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="124" width="300" height="418" rx="6" fill="#363d45" stroke="#6b7782"/>
<text x="34" y="148" font-size="14" font-weight="700" fill="#e9edf0">ClusterComputeResource</text>
<text x="34" y="166" font-size="12" fill="#b6bfc8">vCenter's own object, 8 cptvsan groups</text>
<text x="34" y="190" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Capacity</text>
<text x="34" y="210" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Data Protection</text>
<text x="34" y="230" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|ESA Dedup</text>
<text x="34" y="250" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Network|RDT</text>
<text x="34" y="270" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|PMEM</text>
<text x="34" y="290" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Resync</text>
<text x="34" y="310" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Storage I/O</text>
<text x="34" y="330" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|zDOM</text>
<line x1="490" y1="74" x2="490" y2="124" stroke="#e9edf0" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="340" y="124" width="300" height="418" rx="6" fill="#363d45" stroke="#6b7782"/>
<text x="354" y="148" font-size="14" font-weight="700" fill="#e9edf0">HostSystem</text>
<text x="354" y="166" font-size="12" fill="#b6bfc8">vCenter's own object, 17 cptvsan groups</text>
<text x="354" y="190" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|CPU</text>
<text x="354" y="210" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Disk</text>
<text x="354" y="230" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Disk Group</text>
<text x="354" y="250" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|ESA Dedup</text>
<text x="354" y="270" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|File Service</text>
<text x="354" y="290" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|IOInsight</text>
<text x="354" y="310" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Memory</text>
<text x="354" y="330" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Network|Host</text>
<text x="354" y="350" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Network|Physical NIC</text>
<text x="354" y="370" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Network|TCP/IP Stack</text>
<text x="354" y="390" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Network|VMkernel NIC</text>
<text x="354" y="410" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|PMEM</text>
<text x="354" y="430" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Placement</text>
<text x="354" y="450" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Storage I/O</text>
<text x="354" y="470" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|iSCSI</text>
<text x="354" y="490" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|vSAN Direct</text>
<text x="354" y="510" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|zDOM</text>
<line x1="490" y1="74" x2="810" y2="124" stroke="#e9edf0" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="660" y="124" width="300" height="418" rx="6" fill="#363d45" stroke="#6b7782"/>
<text x="674" y="148" font-size="14" font-weight="700" fill="#e9edf0">VirtualMachine</text>
<text x="674" y="166" font-size="12" fill="#b6bfc8">vCenter's own object, 3 cptvsan groups</text>
<text x="674" y="190" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|VM</text>
<text x="674" y="210" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|Virtual Disk</text>
<text x="674" y="230" font-size="12.5" font-family="Consolas, Menlo, monospace" fill="#8fd3ff">cptvsan|vSCSI</text>
<text x="490" y="574" text-anchor="middle" font-size="12" fill="#b6bfc8">Nothing is created or re-parented on these objects; the metrics are added to them.</text>
</svg>
