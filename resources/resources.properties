# Display strings for vSAN Host Metrics, keyed by describe.xml nameKey. GENERATED.

1=vSAN Host Metrics
2=vCenter credential
3=vCenter password
4=vSAN Host Metrics Adapter Instance
5=vCenter Server
5.description=FQDN of the vCenter Server managing the vSAN clusters. Example: vc01.example.com -- NOT an IP address and NOT a URL. vCenter 8.0 Update 3 or later (or 9.0 or later) is required: this pack uses the vSphere JSON API. It must be the same vCenter the VMware vSphere adapter collects, or no metric has an object to land on.
6=vCenter port
6.description=HTTPS port of the vCenter Server. Default 443.
7=vCenter username
7.description=Must include the domain. Example: vsanmon@vsphere.local. Read-only is sufficient: System.View and System.Read propagated from the vCenter root.
8=Verify vCenter certificate
8.description=Set to false unless the VMCA root (or the issuing CA) has been accepted by the platform at Validate Connection. vCenter presents a VMCA-issued certificate. With it true, the server field must hold the FQDN rather than an IP.
